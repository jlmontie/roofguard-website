<!DOCTYPE html>
<html lang="en">
<head>

<body class="thanks-body">

  <main class="thanks-main">
    <div class="container thanks-inner">
      <a href="/" class="thanks-brand" aria-label="RoofGuard home">

      <p class="section-eyebrow eyebrow-light">Quote Request Received</p>

      </p>

      <div class="thanks-meta">
        <div>
          <p class="thanks-meta-label">Need it sooner?</p>
          <a href="tel:+18018996159" class="thanks-meta-value">(801) 899-6159</a>
        </div>
        <div>
          <p class="thanks-meta-label">Email</p>
          <a href="mailto:hello@roofguardutah.com" class="thanks-meta-value">hello@roofguardutah.com</a>
        </div>

      <a href="/" class="btn btn-ghost thanks-back">← Back to RoofGuard</a>
